<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Collection Item</title>
  <link rel="stylesheet" href="/css/edit-item.css">
    <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/header.css">
</head>
<body>

  <main class="admin-container">
    <header class="page-header">
        <h1>Edit Collection Item</h1>
        <p class="subtitle">Edit item information</p>
    </header>

    <nav class="main-nav">
        <a href="add-item.html" class="primary">➕ Add New Item</a>
      <a href="museum.html">🏛 View Collection</a>
      <a href="index.html">Back</a>
      </nav>


      <section class="admin-section">
        <label for="categorySelect">Select Item Type</label>
        <select id="categorySelect">
            <option value="">— Select type —</option>
            <option value="photocard">Photocard</option>
            <option value="album">Album / Merch</option>
        </select>
        </section>
    <!-- Item selector -->
    <section class="admin-section">
      <label for="itemSelect">Select Item</label>
      <select id="itemSelect">
        <option value="">— Select an item —</option>
      </select>
    </section>

    <!-- Edit form -->
    <form id="photocardForm" class="admin-card hidden" enctype="multipart/form-data">
      <h2>Edit Photocard</h2>

      <label>Artist Name <input name="artist_name"></label>
      <label>Member <input name="member"></label>
      <label>Source <select name="pc_source">
        <option value="album">Album</option>
        <option value="first_press">First Press Limited</option>
        <option value="merch">Merchandise</option>
        <option value="pob">POB</option>
        <option value="lucky draw">Lucky Draw</option>
        <option value="store_exclusive">Store Exclusive</option>
        <option value="national_exclusive">National Exclusive</option>
        <option value="special_event">Special Event</option>
        <option value="fanmeet_online">Fan Meeting Online</option>
        <option value="fanmeet_offline">Fan Meeting Offline</option>
        <option value="fansign_online">Fansign Online</option>
        <option value="fansign_offline">Fansign Offline</option>
        <option value="superstar">SuperStar</option>
        <option value="broadcast">Broadcast</option>
        <option value="magazine">Magazine</option>
        <option value="collaboration">Collaboration Merch</option>
        <option value="winner">Winner</option>
      </select></label>
      <label>Version <input name="pc_version"></label>
      <label>Rarity <select name="pc_rarity">
        <option value="bronze">Bronze</option> <!--Standard Album Inclusions-->
          <option value="silver">Silver</option> <!--Common POBs, Merch Limited PCs, Limited Album PCs-->
          <option value="gold">Gold</option> <!--First Press Inclusion, Event PCs (fansign online, ld), Store/National Exclusive PCs, Superstar-->
          <option value="platinum">Platinum</option> <!--Broadcast, Signed Inclusion Only (MWAVE), IRL Fansign, Limited Album+StoreExc-->
          <option value="Diamond">Diamond</option> <!--Signed PCs, Signed Polaroids, First Press (100 copies only)-->
      </select></label>
      <label>Condition <select name="condition">
        <option value="like_new">Like New</option>
        <option value="good">Good</option>
        <option value="fair">Fair</option>
        <option value="damaged">Damaged</option>
      </select></label>
      <label>Purchase Location <input name="purchase_location"></label>
      <label>Trade Value <input name="trade_value"></label>
      <label>Front-Facing Image Link <input type="file" name="image_front"></label>
      <label>
        Back-Facing Image Link
        <input type="file" name="image_back">
      </label>
      <label>Notes <textarea name="notes"></textarea></label>

      <button type="submit">Save Photocard</button>
    </form>

    <form id="albumForm" class="admin-card hidden" enctype="multipart/form-data">
      <h2>Edit Album / Merch</h2>

      <label>Artist Name <input name="artist_name"></label>
      <label>Item Name <input name="item_name"></label>
      <label>Publishing Label <input name="publishing_label"></label>
      <label>KOMCA Number <input name="komca_number"></label>
      <label>Release Date <input type="date" name="release_date"></label>
      <label>Item Type <select name="item_type">
        <option value="standard cd">Standard CD</option>
        <option value="standard cd nk">Standard CD Non-Korean</option>
        <option value="limited cd">Limited Edition CD</option>
        <option value="japanese release">Japanese Release</option>
        <option value="digital album">Digital Album</option>
        <option value="vinyl">Vinyl</option>
        <option value="cassette">Cassette</option>
        <option value="bimae">Promotional / Not for Sale</option>
        <option value="gold sticker">Gold KOMCA</option>
        <option value="merch">Merch/Special</option>
        <option value="standard dvd">Standard DVD</option>
        <option value="standard bluray">Standard Bluray</option>
      </select></label>
      <label>Rarity <select name="item_rarity">
        <option value="standard">Standard</option>
          <option value="limited">Limited Copies</option>
          <option value="signed">Signed</option>
          <option value="event">Event Limited</option>
          <option value="national_exclusive">National Exclusive</option>
      </select></label>
      <label>Condition <select name="condition">
        <option value="like_new">Like New</option>
        <option value="good">Good</option>
        <option value="fair">Fair</option>
        <option value="damaged">Damaged</option>
      </select></label>
      <label>Purchase Location <input name="purchase_location"></label>
      <label>Estimated Price <input name="est_marketprice"></label>
      <label>Front-Facing Image Link <input type="file" name="image_front"></label>
      <label>Notes <textarea name="notes"></textarea></label>

      <button type="submit">Save Album</button>
    </form>


  <script src="/js/edit-item.js"></script>
</body>
</html>
